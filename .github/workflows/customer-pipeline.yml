
name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  customer-processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python Script
        run: python customer_processing.py

      - name: Display Success
        run: echo "Customer Processing Executed Successfully 1"
