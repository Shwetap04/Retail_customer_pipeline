
name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  customer-processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTest
        run: python -m pip install pytest

      - name: Run Customer Validation Tests
        run: python -m pytest -v

      - name: Execute Customer Processing
        run: python customer_processing.py

      - name: Display Success
        run: echo "Customer Processing Completed Successfully"
